<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FlowBridge validation matrix</title>
  <desc id="desc">Validation cases for overdue follow-up, decision-maker override, low-budget not-fit, and closed-won duplicate alert suppression.</desc>
  <rect width="1200" height="700" rx="36" fill="#0b1220"/>
  <text x="70" y="86" fill="#f8fafc" font-family="Arial" font-size="40" font-weight="800">Blind Validation Matrix</text>
  <text x="70" y="124" fill="#94a3b8" font-family="Arial" font-size="19">Key edge cases verified after iterative rule refinement</text>

  <g transform="translate(70 180)">
    <rect width="1060" height="94" rx="18" fill="#121e2f" stroke="#2b425d"/>
    <text x="24" y="34" fill="#7dd3fc" font-family="Arial" font-size="16" font-weight="700">SOPHIA MARTINS</text>
    <text x="220" y="34" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Overdue follow-up with no task</text>
    <text x="220" y="64" fill="#86efac" font-family="Arial" font-size="15">PASS · None/blank task still triggers overdue when Next Follow-up is past due</text>
  </g>

  <g transform="translate(70 292)">
    <rect width="1060" height="94" rx="18" fill="#121e2f" stroke="#2b425d"/>
    <text x="24" y="34" fill="#c4b5fd" font-family="Arial" font-size="16" font-weight="700">GRACE BELLO</text>
    <text x="220" y="34" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Influencer authority override</text>
    <text x="220" y="64" fill="#86efac" font-family="Arial" font-size="15">PASS · needs_discovery + action to identify and involve the decision maker</text>
  </g>

  <g transform="translate(70 404)">
    <rect width="1060" height="94" rx="18" fill="#121e2f" stroke="#2b425d"/>
    <text x="24" y="34" fill="#fcd34d" font-family="Arial" font-size="16" font-weight="700">DANIEL SMITH</text>
    <text x="220" y="34" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Confirmed budget below minimum</text>
    <text x="220" y="64" fill="#86efac" font-family="Arial" font-size="15">PASS · not_fit + do-not-advance/disqualify action</text>
  </g>

  <g transform="translate(70 516)">
    <rect width="1060" height="94" rx="18" fill="#121e2f" stroke="#2b425d"/>
    <text x="24" y="34" fill="#fda4af" font-family="Arial" font-size="16" font-weight="700">IBRAHIM MUSA</text>
    <text x="220" y="34" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Closed Won missing revenue fields</text>
    <text x="220" y="64" fill="#86efac" font-family="Arial" font-size="15">PASS · Critical specific alerts without duplicate generic Missing Deal Value</text>
  </g>

  <text x="70" y="660" fill="#64748b" font-family="Arial" font-size="14">Synthetic portfolio validation — no real client or revenue data.</text>
</svg>