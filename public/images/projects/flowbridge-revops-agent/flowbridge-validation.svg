<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FlowBridge RevOps Agent blind validation</title>
  <desc id="desc">A portfolio visual summarizing requirements discovery, rule design, blind testing of 16 synthetic CRM records, and 24 detected CRM issues.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg2)"/>
  <circle cx="1080" cy="70" r="210" fill="#0ea5e9" opacity=".10"/>
  <circle cx="100" cy="640" r="180" fill="#22c55e" opacity=".08"/>

  <text x="70" y="82" fill="#7dd3fc" font-family="Arial" font-size="20" font-weight="700" letter-spacing="2">FLOWBRIDGE · REVOPS SYSTEM DESIGN</text>
  <text x="70" y="132" fill="#f8fafc" font-family="Arial" font-size="42" font-weight="800">CRM Audit &amp; Lead Qualification Agent</text>
  <text x="70" y="170" fill="#cbd5e1" font-family="Arial" font-size="20">Requirements → rules → edge cases → blind validation</text>

  <g transform="translate(70 220)">
    <rect width="250" height="132" rx="22" fill="#102036" stroke="#28445f"/>
    <text x="24" y="38" fill="#7dd3fc" font-family="Arial" font-size="15" font-weight="700">01 · REQUIREMENTS</text>
    <text x="24" y="72" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Business Rules</text>
    <text x="24" y="100" fill="#cbd5e1" font-family="Arial" font-size="15">ICP · stages · SLA · fields</text>
  </g>

  <g transform="translate(340 220)">
    <rect width="250" height="132" rx="22" fill="#102036" stroke="#28445f"/>
    <text x="24" y="38" fill="#c4b5fd" font-family="Arial" font-size="15" font-weight="700">02 · DECISION LOGIC</text>
    <text x="24" y="72" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Score + Overrides</text>
    <text x="24" y="100" fill="#cbd5e1" font-family="Arial" font-size="15">Budget · need · authority · time</text>
  </g>

  <g transform="translate(610 220)">
    <rect width="250" height="132" rx="22" fill="#102036" stroke="#28445f"/>
    <text x="24" y="38" fill="#86efac" font-family="Arial" font-size="15" font-weight="700">03 · CRM CONTROLS</text>
    <text x="24" y="72" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Lifecycle Audit</text>
    <text x="24" y="100" fill="#cbd5e1" font-family="Arial" font-size="15">Owner · tasks · value · staleness</text>
  </g>

  <g transform="translate(880 220)">
    <rect width="250" height="132" rx="22" fill="#102036" stroke="#28445f"/>
    <text x="24" y="38" fill="#fcd34d" font-family="Arial" font-size="15" font-weight="700">04 · VALIDATION</text>
    <text x="24" y="72" fill="#fff" font-family="Arial" font-size="23" font-weight="700">Blind Test</text>
    <text x="24" y="100" fill="#cbd5e1" font-family="Arial" font-size="15">Independent 16-record dataset</text>
  </g>

  <g stroke="#45627d" stroke-width="3">
    <line x1="320" y1="286" x2="340" y2="286"/>
    <line x1="590" y1="286" x2="610" y2="286"/>
    <line x1="860" y1="286" x2="880" y2="286"/>
  </g>

  <g transform="translate(70 404)">
    <rect width="1060" height="200" rx="26" fill="#0a1728" stroke="#28445f"/>
    <text x="28" y="42" fill="#f8fafc" font-family="Arial" font-size="20" font-weight="700">Blind-test outcome · synthetic data only</text>

    <g transform="translate(28 66)">
      <rect width="180" height="100" rx="18" fill="#0c2d48"/>
      <text x="20" y="30" fill="#7dd3fc" font-family="Arial" font-size="14">Records audited</text>
      <text x="20" y="72" fill="#fff" font-family="Arial" font-size="38" font-weight="800">16</text>
    </g>
    <g transform="translate(224 66)">
      <rect width="180" height="100" rx="18" fill="#123024"/>
      <text x="20" y="30" fill="#86efac" font-family="Arial" font-size="14">CRM issues</text>
      <text x="20" y="72" fill="#fff" font-family="Arial" font-size="38" font-weight="800">24</text>
    </g>
    <g transform="translate(420 66)">
      <rect width="180" height="100" rx="18" fill="#3b2508"/>
      <text x="20" y="30" fill="#fcd34d" font-family="Arial" font-size="14">Critical</text>
      <text x="20" y="72" fill="#fff" font-family="Arial" font-size="38" font-weight="800">2</text>
    </g>
    <g transform="translate(616 66)">
      <rect width="180" height="100" rx="18" fill="#431b23"/>
      <text x="20" y="30" fill="#fda4af" font-family="Arial" font-size="14">High</text>
      <text x="20" y="72" fill="#fff" font-family="Arial" font-size="38" font-weight="800">12</text>
    </g>
    <g transform="translate(812 66)">
      <rect width="180" height="100" rx="18" fill="#2d2250"/>
      <text x="20" y="30" fill="#c4b5fd" font-family="Arial" font-size="14">Medium</text>
      <text x="20" y="72" fill="#fff" font-family="Arial" font-size="38" font-weight="800">10</text>
    </g>
  </g>

  <text x="70" y="650" fill="#94a3b8" font-family="Arial" font-size="15">Qualification: 5 hot_lead · 6 qualified · 2 needs_discovery · 1 nurture · 2 not_fit</text>
</svg>